# 同系列筹码的上位替代和对比要点。可以直接手改，改完直接生效。
#
# 同一次三选一里出现同系列的两张或三张筹码时：
#   strict = true    严格上位替代：high 包含 low 的全部效果，在任何局面都不比 low 差。
#                    low 不参与推荐度的比较，悬浮窗写「被X上位替代」；high 下面写「比X多{high_gain}」。
#                    资料上还要满足三条（载入时检查，不满足的一对记警告后忽略）：标签不计「通用」时，low 的标签 high 都有；
#                    流派相同；high 没有 low 没有的职业分值。
#   strict = false   两张各有所长，或资料上不满足上面三条：都参与推荐度的比较，各自下面写「比X多{gain}」。
# X 是对方筹码：「被X上位替代」里的 X，悬浮窗写对方稀有度的颜色（蓝色、紫色、金色），命令行和诊断包写筹码名；
# 「比X多」里的 X 一律写对方稀有度的颜色。
# 只在这一次三选一里调整：前瞻、刷新的期望和刷新代价都不受影响。
#
# 字段：
#   low / high       同系列的低一级和高一级（稀有度由低到高：蓝、紫、金）
#   strict           是否严格上位替代（见上）
#   reason           算或不算严格上位替代的理由，一句话，以「算：」或「不算：」开头；只给维护资料的人看，界面上不显示
#   low_gain         low 比 high 多的要点（只写要点，不以「比」开头）；strict = true 时不写
#   high_gain        high 比 low 多的要点；没有可写的要点时留空（该筹码下面不写对比行）
#   tip              悬停说明：两张的效果对照，写成完整的句子。可写 {starlight_use}：按当前角色和已有筹码写星光层数的其他用处
#                    （文件末尾的 [[starlight_use]]），有用处时写成「星光层数另有用处（……）」，都没有时写成「星光层数另有用处时」
#
# 图标相同的筹码是同一系列，两两都要在本文件里写一对，每一对都要写 reason：生成资料时缺了会报错并列出来。
# 三张同系列同时出现时，先标出被严格上位替代的，剩下的几张之间再写对比行；
# 剩下的那张和别的筹码之间没有对比行时，写它比被替代的那张（取稀有度最高的）多什么。
# 游戏改了同系列筹码的效果时，照新的效果手工更新本文件。

