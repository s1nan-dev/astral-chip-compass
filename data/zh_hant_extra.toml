# 人补的简体 → 繁体词组（写法：简体词 = 繁体词，写的是最终的繁体写法）。
#
# 什么时候要补：界面文字里的某个简体字在单字表里有一个以上的繁体候选，词组表（OpenCC 的 STPhrases）又没盖住，
# 简繁对照表的测试会把这一处拦下来，列出是哪条文字、第几个字、几个候选。照繁体的用词和字形补一条，例如：
#
#   "软件" = "軟體"
#
# 这里写的是转换的最终结果，不再经过后面的繁体用词、字形替换。这个文件由人维护，对照表生成工具不改它。

"许可证" = "許可證"
"隐私" = "隱私"
"推荐" = "推薦"
"对局" = "對局"
"本局" = "本局"
"上一局" = "上一局"
"文件夹" = "資料夾"
"后台" = "背景"
"前台" = "前景"
"玩游戏" = "玩遊戲"
"背景" = "背景"
"录屏" = "螢幕錄影"
"错误代码" = "錯誤代碼"
"窗口出错" = "視窗出錯"
"选了" = "選了"
"只认" = "只認"
"才生效" = "才生效"
"并更换" = "並更換"
"2 个" = "2 個"
"4 个" = "4 個"
"结束后" = "結束後"
"点击后" = "點選後"
"开启后" = "開啟後"
"切换后" = "切換後"
"启动后" = "啟動後"
"出现后" = "出現後"
"设置里" = "設定裡"
"在后台" = "在背景"
"一出现后" = "一出現後"
"帮助拾星助手改善推荐准确度" = "幫助拾星助手改善推薦準確度"
"准确" = "準確"
"会向" = "會向"
"不会发送" = "不會傳送"
# 繁体用词换成下面这些，在游戏界面里不对：照游戏繁体的写法
"刷新" = "刷新"
"高级" = "高級"
"镜像" = "鏡像"
"声明" = "聲明"
"参数" = "參數"
# 进程照 Windows 繁体中文版工作管理员的写法。OpenCC 的繁体用词把「進程」换成「程序」，再转一遍「程序」又会换成
# 「程式」：直接写成最终写法。进程号写成「處理程序識別碼」（PID 的说法）；「放进程序」「存不进程序」里的「进程序」
# 是「进」加「程序」，不是进程
"进程" = "處理程序"
"进程号" = "處理程序識別碼"
"进程序" = "進程式"

# 于：作介词（在、到）时写「於」；「关于」「由于」这类 OpenCC 的词组已经盖住，这里只补跨词的「照旧于」
"照旧于" = "照舊於"
# 并：连接两件事写「並」；合并写「合併」，OpenCC 的词组已经盖住
"并选中" = "並選中"
"并保存" = "並儲存"
"并看到" = "並看到"
"并补录" = "並補錄"
"选择并" = "選擇並"
# 发：发出、发布写「發」，头发才写「頭髮」
"发方案" = "發方案"
"发不了" = "發不了"
"第一次发" = "第一次發"
"发对局报告" = "發對局報告"
# 向：介词（朝着、对着）写「向」，不写「嚮」「曏」
"向作业站" = "向作業站"
# 布：台湾教育部标准字体把发布写作「發布」；OpenCC 的「發佈」会再换成「釋出」，几处文字里有的成了「發布」、有的成了
# 「釋出」：「发布」一律写「發布」
"发布" = "發布"
# 签：界面上的分页写「頁籤」；签名、标签由 OpenCC 的词组各写「簽名」「標籤」
"页签" = "頁籤"
# 制：机制、控制、限制写「制」，制作才写「製作」；OpenCC 的「游戏机」会吞掉「机制」的「机」，这里先锁住整个词
"游戏机制" = "遊戲機制"
# 御：防御写「防禦」；断行用的词表是一个词一个词单独转的，单独的「御力」也要和在句子里转出来的一样
"御力" = "禦力"
# 注：注意写「注」，注册、注释、备注写「註」；界面上单独作提示前缀的「注：」写「註：」
"注：" = "註："
# 闲：空闲、闲置写「閒」
"空闲" = "空閒"
# 须：必须、须附上写「須」，胡须才写「鬚」
"须附上" = "須附上"
# 象：程序里的对象（object）写「物件」，只锁界面文字里用到的这几处；别的意思的「对象」（适用对象等）写法要看词，
# 不一概换成「物件」，新写的会被简繁对照表的测试拦下来再定
"帧对象" = "幀物件"
"应为对象" = "應為物件"
"JSON 对象" = "JSON 物件"
# 链：工具链写「工具鏈」，链条、锁链也写「鏈」
"工具链" = "工具鏈"
# 占：占用、占据、占满写「佔」
"占整机" = "佔整機"
# 台：平台、这台电脑照游戏繁体（「平台服務條款」）和繁体 Windows 的写法用「台」；OpenCC 的词组会写成「臺」：这两个词锁住
"平台" = "平台"
"这台电脑" = "這台電腦"

# 以下几条是 OpenCC 的词组跨过了词的边界：这些字连起来时不能按它那样合并
# 「一出」按戏曲的「一齣」转，会把「三选一出推荐」转成「三選一齣推薦」；锁住「出推荐」
"出推荐" = "出推薦"
# 「一里」是距离（一里路），会把「三选一里」的「里」（里面）留住不换；锁住「选一里」
"选一里" = "選一裡"
# 「天后」按「天后」这个词转，会把「7 天后再试」的「天后」留住；锁住「天后再试」
"天后再试" = "天後再試"
# 「上游」会盖住「屏幕上游戏窗口」的「上游」；「游戏」在这个程序里都写「遊戲」
"游戏" = "遊戲"
# 「有采」会盖住「没有采用」的「采用」；采用写「採用」
"采用" = "採用"
# 「单只」按量词转，会把「清单只从」的「只」转成「隻」；这里「只」表示仅仅，写「只」
"清单只从" = "清單只從"
# 「本里」是一条地名词组（转出来还是「本里」），会盖住「新版本里」的「里」（里面）；锁住「版本里」
"版本里" = "版本裡"

# 照游戏繁体客户端的写法
# 全屏：游戏设置里的显示模式写「全螢幕」「視窗化」（窗口化由繁体用词换成「視窗化」）；「全屏幕」一并写定，免得锁住
# 「全屏」以后多出一个「幕」
"全屏" = "全螢幕"
"全屏幕" = "全螢幕"
# 账号、账户：游戏和繁体 Windows 都写「帳號」「帳戶」；转账照游戏写「轉賬」，不在这里改
"账号" = "帳號"
"账户" = "帳戶"

# 资料库里的筹码效果、适配表里的理由和分项说明会原样显示在悬浮窗上（推荐理由、悬停说明、已有筹码的说明），
# 不在界面模块的常量里。这些字在句子里写哪一种要看词，OpenCC 的词组没盖住，逐词锁住。
# 吃：吃下食物、吃掉写「吃」；OpenCC 的单字表先给「喫」，繁体字形再换成「吃」被拦下
"吃下" = "吃下"
# 几：前几轮、只用「幾」；「几乎」由 OpenCC 的词组盖住
"几轮" = "幾輪"
# 合：回合、配合写「合」（不是「閤」）
"回合" = "回合"
"配合" = "配合"
# 并：连接两件事写「並」；下面这些搭配 OpenCC 的词组没盖住
"并恢复" = "並恢復"
"并对" = "並對"
"并获得" = "並獲得"
"并提高" = "並提高"
"并返回" = "並返回"
"并加入" = "並加入"
"并施加" = "並施加"
"并按" = "並按"
"并消耗" = "並消耗"
"并额外" = "並額外"
"并使" = "並使"
"并早" = "並早"
"并另" = "並另"
# 制：复制写「複製」；控制、限制、制作分别写「制」「製」，由 OpenCC 的词组盖住
"复制" = "複製"
# 发：分发、多发写「發」；头发由 OpenCC 的词组写「髮」
"多发" = "多發"
# 占：占据、占掉写「佔」
"占流派" = "佔流派"
# 扇：手持风扇（名词）写「風扇」；扇风（动词）才写「搧」
"手持风扇" = "手持風扇"
# 扎：扎进怪物堆写「扎」（不是「紮」）
"扎进" = "扎進"
# 抵：抵消、抵挡写「抵」（不是「牴」）
"抵消" = "抵消"
# 挂：挂着写「掛」
"挂着" = "掛著"
# 种：量词「一种」「几种」写「種」。单字锁住以后「几种」的「几」会落单、按单字被拦下，一并锁住
"种" = "種"
"几种" = "幾種"
# 合并、一并写「併」：上面「并对」「并按」这类先锁的词组会从「合并对象」「一并对待」中间切开，把它们写成「並」
"合并" = "合併"
"一并" = "一併"
# 只：表示仅仅写「只」；「多半只损失」的「只」是仅仅，OpenCC 的「多半只」会按量词转成「隻」
"只损失" = "只損失"
# 核：处理器的核写「核」（大核、小核、2 核）；OpenCC 另给一个极少用的异体字，单字时拦下
"核" = "核"
# 电脑和 Windows 的叫法：照繁体的说法和繁体版 Windows 上看到的字样（「节能」「最佳能效」是电源模式、电源计划的名字）
"笔记本" = "筆電"
"节电模式" = "省電模式"
"电源和电池" = "電源與電池"
"最佳能效" = "最佳電源效率"
"「节能」" = "「省電」"
"控制面板" = "控制台"
