[difficulty]

[heal_knife]
# 美工刀与治愈来源（只对带 traits 中特性的角色生效，其余角色按组合规则的原分值）：
#   ① 还没有美工刀时，combos 两条组合规则改为预判：治愈来源加「之后的三选一里出现并会选美工刀的概率 × 组合分 × anticipation_factor」。
#      概率：剩余三选一次数 n 次里 knives 至少出现一把；只算总分达到推荐线的美工刀。n 次按次数分开算，和前瞻同一个口径
#      （[lookahead]）：剩下的升星一定会来，L 次（剩余升星次数，不超过 n）按下一星的升星；其余 n − L 次是任务和筹码商店，
#      按两者在一局里的占比混合，稀有度按当前星数（任务等级取当前星数、至少 1 级）。一次三选一的三格出自同一种来源，一把都
#      不出现的概率按来源分别算、再按占比加权；n 次都不出现的概率是升星那一类的 L 次方乘混合那一类的 n − L 次方。3 星以后
#      L = 0。组合分按一把美工刀计。
#   ② 已有美工刀时，combos 两条组合规则的分值改为 per_layer × layers 里这个来源的层数 × 持有的美工刀数
#      （两把美工刀时层数计两次）。
# layers：稳定治愈层数另加 1 层。
#   稳定治愈层数：治愈在回合开始时恢复等同层数的生命，回合结束时层数减少一半、减少的层数向上取整
#   （3 层减 2 层剩 1 层，1 层减 1 层剩 0 层）。每回合开始时获得 g 层的来源，从 0 层起，自己回合里的层数
#   稳定在 2g − 1 层（3 层的来源依次是 3、4、5、5……层，回合结束后剩 g − 1 层）：
#   完备治疗每回合 3 层 → 5；紧急治疗、大碗炖肉每回合 1 层 → 1；条件来源按约每回合 1 层 → 1。
#   另加的 1 层计治愈来源的另一半收益：每回合恢复生命，美工刀「生命值为满」时的攻击力加成更易保住。
#   完备治疗 5 + 1 = 6，其余 1 + 1 = 2。
# per_layer = 7.5：每回合 1 层的来源计 2 层，即 15，与组合规则「治愈来源与美工刀」的原分值相同（物理输出角色
#   不低于其他角色）；持有一把美工刀时完备治疗 6 × 7.5 = 45（组合规则原分值 25）。
traits = ["物理输出"]
knives = ["美工刀-初级", "美工刀-锋利"]
combos = ["完备治疗与美工刀", "治愈来源与美工刀"]
per_layer = 7.5
# anticipation_factor：预判分的系数。
#   算出的概率偏高（职业筹码池表本身也不完整）：梦想号实机第 5 轮（美咲 1 星，已有普通瞄具），实际第 16 轮才在筹码商店拿到
#   美工刀。过去把之后每一次三选一都按下一星的升星算（任务和筹码商店也当成升到 2 星那样，最左格固定紫色、出自职业筹码池），
#   这一局算出约 80%，取 0.5 按一半计入（约 40%）；美咲第 5 轮（电流剑 / 医疗箱-紧急治疗 / 速度轮滑-中级）因此不首推医疗箱。
#   按次数分开算以后（剩下的 2 次升星按 2 星的升星，其余约 2.7 次按 1 星时的任务和筹码商店），同一局算出约 56%：原来的偏高
#   大半来自把任务和筹码商店也当成升星。要和原来一样计入约 40%，系数约 0.72，取 0.7；第 5 轮照旧首推速度轮滑-中级。
#   35 个角色 1 星、没有已有筹码时，物理输出角色的治愈来源的预判分平均约 +6.3（原来约 +7.1）。
#   已持有美工刀后按治愈层数计分（②）不受影响。
anticipation_factor = 0.7
layers = { "医疗箱-完备治疗" = 6, "医疗箱-紧急治疗" = 2, "大碗炖肉" = 2, "维生素药丸" = 2, "可口糖果" = 2, "缓冲盾牌" = 2, "友情徽章" = 2 }
# ③ 治愈来源折算：还没有治愈来源时，traits 那条特性给 knives 的加分按「之后获得治愈来源的概率」折算，
#    少算的部分记一项「组合」扣分（「尚无治愈来源，难以保持满血」）。没有治愈来源时美工刀的满血条件难以稳定满足。
#    治愈来源 = layers 里的筹码；已持有其中任意一个，或队友里有带 healer_traits 特性的角色（视同已有治愈来源）时照常全额。
#    概率和①同一算法（按次数分开算）：按选择美工刀之后的筹码池、流派和职业分值，剩余三选一次数里至少出现一个，
#    只算总分达到推荐线的治愈来源；不乘 anticipation_factor（这里是折算，不是预判加分）。
#    带 exclude_traits 特性的角色不折算。现在不排除任何特性：帕帕拉的潜能只在主动技能那一轮把她视为半血，美工刀照样按
#    实际生命值是否为满判断，没有治愈来源时同样难以保持满血，和其他物理输出角色一样折算（她和半血加成的冲突另由「半血」
#    特性的扣分处理）。
#    要尽量保住推荐流派的角色（适配表 [[hero]] 的 keep_schools），美工刀属于要保的流派时，它的推荐流派加分
#    （[synergy] school）一并折算。
#    ①预判美工刀时判断「会不会选美工刀」不计这一项：预判的是选择治愈来源之后的情形。
healer_traits = ["治疗友方"]
exclude_traits = []

[charge_build]
# 开套预判（分项名「组合」）：还没有持有 school 流派的筹码时，该流派的筹码加
#   「之后出现并会选择的配套筹码的概率 × 组合分 × factor」。
#   配套筹码和组合分取以该筹码为「已持有」一方的组合规则（例：已持有永动机 → 电流核心、电磁炮 +25），
#   同一筹码有几条时组合分取最高的一条。概率和美工刀预判同一算法（按次数分开算，见 [heal_knife] ①）：按选择该筹码之后的
#   筹码池和流派，剩余三选一次数里至少出现一次；只算总分达到推荐线的配套筹码。
# 依据：充能筹码要有来源和消耗配套才生效，已持有一张后组合规则使同套筹码约翻倍（持有永动机时电磁炮 35.9 → 78.4），
#   第一张却只按单拿计分。factor 原来和美工刀预判取同一个数 0.5：每张约 +5~11，35 个角色的充能平均分 22.5 → 28.4，
#   横向首推变化 1.0%。按次数分开算以后照旧取 0.5，不跟美工刀预判改为 0.7：配套筹码除电流剑以外都不在职业筹码池里，只出在
#   最左格以外的几格，原来「把任务和筹码商店也当成升星」对它们几乎没有高估；35 个角色 1 星、没有已有筹码、地图待识别时，
#   每张的预判分平均 +5.4 → +5.7（约 +1～12），和原来定 0.5 时的大小相同。3 星以后任务三格全随机，配套筹码的概率比按升星时
#   高两成多。
school = "充能"
factor = 0.5

[sources]
# 体系来源：适配表（synergy.toml）规则的 needs_source（有来源时才生效）、without_source（没有来源时才生效）写这里的名字。
#   chips：已持有其中任意一个筹码就算有来源；heroes：自己的角色或任一队友（真人、电脑都算）是其中的角色也算，
#   这些角色的技能本身就提供这种效果。推算「拿了以后」时按假设的已有筹码算；正在评估的候选自己不算它自己的来源。
# 充能：获得充能的筹码（永动机、能量回收、电流剑、电击手套、跃迁引擎），和适配表组合规则「永动机与充能消耗」
#   「充能来源与充能消耗」的已持有一栏合起来相同；安全气囊受到伤害时才获得 1 层，太慢，不算。
#   电击手套改为使用主动技能后每击中 1 个怪物获得 1 层（不再消耗充能），次数跟着主动技能走，仍算（见适配表「充能来源」）。
"充能" = { chips = ["永动机", "能量回收", "电流剑", "电击手套", "跃迁引擎"] }
# 标记来源：不必发起战斗就能对怪物施加标记的筹码（标靶、标记喷罐、两种手持风扇），以及技能施加同一种标记的队友邦妮。
#   瞄具要攻击才施加，魔法箭袋只在怪物已带标记时再加 1 层，都不算。
"标记来源" = { chips = ["标靶", "标记喷罐", "手持风扇-小", "手持风扇-大"], heroes = ["邦妮"] }
# 持续治愈：每回合都给治愈层数的筹码，以及技能常为队友恢复生命的角色（「治疗友方」特性的几名）。
#   缓冲盾牌、友情徽章、维生素药丸、可口糖果要满足条件才给，不算。
"持续治愈" = { chips = ["医疗箱-完备治疗", "医疗箱-紧急治疗", "大碗炖肉"], heroes = ["璐璐", "潘大猛", "姬梦朝", "吉尔", "多萝西"] }
# 轨道炮：回合结束时手牌少于 6 张就获得 1 张轨道炮（6 点伤害的效果牌）的探天卫星。
"轨道炮" = { chips = ["探天卫星"] }
# 补牌：每回合补充手牌、复制效果牌加入手牌的筹码；出牌数：提高出牌数的筹码（可口糖果在生命值为满时、电流核心在使用主动技能后）。
"补牌" = { chips = ["探天卫星", "魔法秘典"] }
"出牌数" = { chips = ["大背包", "忍术飞镖", "古老法杖", "可口糖果", "电流核心"] }
# 预先标记：不靠自己出效果牌就让怪物先带上标记的筹码（标靶、两种手持风扇）和技能施加标记的凛、邦妮；标记喷罐在效果牌
#   造成伤害后才施加，每回合只出 1 张效果牌时接不上魔法箭袋，不算。梅加斯的魔法箭袋按它判断。
"预先标记" = { chips = ["标靶", "手持风扇-小", "手持风扇-大"], heroes = ["凛", "邦妮"] }
# 多拿牌：每回合额外获得卡牌的筹码（无限之蛇由龙宫游乐园发放）。梅加斯的主动技能丢弃全部手牌，手牌补得快时缩短冷却才有收益。
"多拿牌" = { chips = ["探天卫星", "智能手表", "手持风扇-大", "无限之蛇"] }
# 星光筹码：星光流派的全部筹码，已持有任意一张即已进入星光流派。米米、照、潘大猛也用这个来源；米米星光固定、排在治愈前面：
#   还没有星光的筹码时，她的治愈、充能筹码扣分，星光先进。
"星光筹码" = { chips = ["银行卡-余额少", "银行卡-余额多", "银行卡-用不完", "“8面”骰子", "ATM机", "手电筒-强光", "星币锤", "紫色飞星", "金色飞星"] }
# 治愈来源：[heal_knife] layers 的 7 张治愈筹码，以及技能常为队友恢复生命、施加治愈的角色（和「持续治愈」比，多了要满足条件才给
#   治愈的 4 张）。阿兰娜的美工刀按「满血输出」计的分不受美工刀折算影响，还没有治愈来源时另扣分。
"治愈来源" = { chips = ["医疗箱-完备治疗", "医疗箱-紧急治疗", "大碗炖肉", "维生素药丸", "可口糖果", "缓冲盾牌", "友情徽章"], heroes = ["璐璐", "潘大猛", "姬梦朝", "吉尔", "多萝西"] }
# 治愈筹码：同「治愈来源」的 7 张筹码，不列角色。多萝西自己在「治愈来源」的角色名单里（她为队友恢复生命），她按「还没有
#   治愈筹码」判断的规则用这一份：第一张治愈筹码使她之后每回合开始恢复一次生命，温暖累积约快一倍。
"治愈筹码" = { chips = ["医疗箱-完备治疗", "医疗箱-紧急治疗", "大碗炖肉", "维生素药丸", "可口糖果", "缓冲盾牌", "友情徽章"] }

[lookahead]
# 前瞻分 = weight × picks[星数] 次三选一里，每次（拿了之后的期望最高分 − 不拿时的）之和
#   拿了：这个筹码移出筹码池，它的份额让给同稀有度、同一职业筹码池的其他筹码；带来新流派时还有加权和锁定。
#   不拿：这个筹码仍在筹码池里占着份额，但分值记为 0，所以「拿走后自己不会再出现」不算损失。
# 这几次三选一按次数分开算：剩下的升星一定会来，先算满，min(剩余升星次数, 次数) 次按下一星的升星（最左格是固定稀有度、
#   出自职业筹码池）；其余按任务和筹码商店两种三选一混合，占比和 [picks] 同一个口径：本地图最高难度的筹码任务数 × task_rate
#   对 shop（地图待识别时每张候选地图按各自的任务数），稀有度按当前星数。任务三格全随机，等级取当前星数（至少 1 级；3 星时
#   3 级，同 [endless_cycle] 额外那次三选一）；筹码商店照升星的规则，最左格是当前星数的固定稀有度、出自职业筹码池。一次
#   三选一的三格出自同一种来源，期望最高分和出现率都按占比加权。
#   0～1 星剩下的升星不少于 picks[星数]，全按升星；2 星的 1.5 次里 1 次是升到 3 星那次，多出的半次按混合；3 星以后全按混合。
#   例：筹码任务 3.5 个时任务约占 78%、筹码商店约 22%，「拿了这张，另一张更常出现在最左格」这类前瞻在 3 星以后小得多。
#   说明里的「下次出现率」按下一次三选一的主体写：0～2 星是升星，3 星以后是任务和筹码商店。
#   美工刀预判、治愈来源折算、开套预判（[heal_knife]、[charge_build]）看的之后几次三选一也按这个口径。
weight = 1.0
# 行号 = 星数；相当于「这个变化还能影响后面几次选择」。实际取值不超过预计剩余的筹码三选一次数（见 [picks]）：
# 预计之后没有三选一时前瞻记 0，卡片上不写前瞻。持有的筹码数不设上限，不按空着的格数封顶
picks = [2.0, 2.0, 1.5, 1.0]
round_advance = 3            # 估算下一次三选一时轮次往后推几轮
# 前瞻理由里的「高适配度筹码」（代码注释里叫「高分筹码」）：不计前瞻、按当前已有筹码算的分值 ≥ 此值。
# 取值依据：内置分全额计入时按 [official] strong（100）划线，35 个角色 × 不分地图的筹码（1 星、无筹码）里 13% 达到；
# 内置分 ×0.5 以后取同一比例的分数线（≥ 75 的占 12%，≥ 70 的占 15%）。
high_value = 75

[reroll_cost]
# 一次刷新的代价 = 用掉它以后少了一次刷新机会的损失 = gain × H(m)
#   m = 预计剩余三选一次数（见 [picks]）÷ 剩余刷新次数，即手里每次刷新平均要照看几次三选一；
#   留着这次刷新，就能把它用在这 m 次里最值得刷新的那一次上。
#   把每次三选一「刷新能多拿的分」看作平均 gain 分的指数分布，m 次里最大值的期望是 gain × H(m)，
#   H 是调和数 1 + 1/2 + … + 1/m（非整数时取连续延拓）：H(0.5) ≈ 0.61，H(1) = 1，H(2) = 1.5，H(4) ≈ 2.08，H(8) ≈ 2.72。
# 剩余刷新越少、后面要选的次数越多，代价越高，不设上限。
# gain 的依据：随机发三选一实测，「刷新后最高分的期望 − 当前最好选项」（不足 0 记 0）的平均，取得略高于 3 星的平均，
#   推荐刷新偏保守。量法：35 个角色、0～3 星各随机发 25 组三选一（最左格按这一星的职业筹码池抽，其余两格按筹码池抽，
#   不含循环往复），轮次和地图待识别、刷新次数按一次都没用过，只刷一次（不按多出来的刷新连着刷）。按现在的打分换 8 组
#   随机种子各量一遍（每组每星 875 次，合起来每星 7000 次），0～2 星平均约 13.0 分（0 星 12.2、1 星 12.8、2 星 14.1）、
#   3 星约 16.8 分（8 组各自在 15.6～17.3 之间），取 18：每一组都高于 3 星的平均。这几批随机三选一里首推刷新的比例
#   0 星约 12%、1 星约 20%、2 星约 29%、3 星约 38%。实战后按推荐日志校准。
# 多出来的刷新不算代价（engine.context.reroll_keep）：刷新次数读到了时，之后的三选一每次留 1 次（预计次数向上取整），
#   再多留 1 次以防估少（「之后还有几次三选一」对着真实对局常估少一次左右）；剩余刷新比这多出来的现在用掉不算代价，
#   可以连着刷，刷新按最多连续刷新这么多次估值。刷新次数没读出来、按「一次都没用过」补的默认值（可能的最多次数）时
#   不按多出来的算，之后还有三选一就只算刷新一次、按上面的公式扣代价。
gain = 18

[picks]
# 本次之后预计还有几次筹码三选一 = 剩余升星次数（到 3 星）+ 预计还有的任务和筹码商店三选一
#   + 循环往复给的额外那次三选一（已拿循环往复、那一次还没给时 1 次），
# 轮次已知时用「进度上限 − 当前轮次」封顶（有循环往复那一次时封顶加 1）。用于刷新代价、循环往复、前瞻影响的选择次数
# （[lookahead] picks 的上限）和之后选到某筹码的概率；收入类筹码的折算不用它（按进度上限算，见 [income]）。
#   一局的任务和商店三选一 = 本地图的筹码任务数（data/maps.json 的 chip_tasks；知道是极限难度时取 extreme 里的任务数）
#   × task_rate + shop；
#   已经有过几次 = 已有筹码数（不含地图直接发放的）− 已升星次数 − 不经三选一拿到的个数 − 循环往复给的额外那次
#   （它不是任务和商店的三选一，不占这一份）。
#   轮次已知时，任务和商店三选一再按「到 end_round 前剩余轮次的比例」收窄。
# 校准依据：最高难度一局一般拿 7–8 个筹码、约第 12–14 轮结束（玩家经验）。
#   现役地图最高难度的筹码任务平均 3.5 个；升星 3 次 + 任务 3.5 × 1.0 + 商店 1.0 = 7.5 个，取经验范围的中值。
#   end_round 按真人对局定（队友都是电脑的对局常打到第 16 轮以后，不按它们调）。
end_round = 13        # 一局大约在第几轮结束
task_rate = 1.0       # 筹码任务的完成比例
shop = 1.0            # 每局从筹码商店购买筹码的次数
default_tasks = 3.5   # 没有地图资料时的筹码任务数
default_cap = 16      # 没有地图资料时的进度上限（现役地图疯狂难度最常见的值）
# 3 星以后的下限：轮次已知、自己已满 3 星时，任务和商店三选一至少为 late_rate ×（H + 0.5），在按 end_round 收窄之后取大。
#   一局没有固定的结束轮次：打倒首领就赢，进度条走到红叉才输；3 星以后任务做完、商店的份额用完，也还会去筹码商店买
#   （3 星以后星币不再用于升星）。没有这个下限时，3 星、第 9～13 轮常被估成「之后没有三选一」，刷新全部连着用、前瞻记 0，
#   实际往往还有。
#   H 是存活条件下预计还剩几轮：结束的轮次假定在「late_from × (进度上限 − 1)」（不早于本轮）到「进度上限前最后能打的
#   一轮」C 之间均匀，取平均再减去本轮；C 不大于本轮时 H 为 0。读到进度条的当前格时 C 按「本轮 +（进度上限 − 当前格）− 1」，
#   进度比轮次走得快时剩下的更少。进度条走到头（剩余轮数为 0）以后照旧由封顶记 0。
#   late_rate = 0.2：实机打完的对局里，3 星以后去筹码商店约每轮 0.21 次。
#   late_from = 0.5：结束轮次最早按半个进度上限算；进度上限 18 时，第 1 轮预计约第 12.75 轮结束，和一局约第 12～14 轮
#   结束的经验相当。
late_rate = 0.2
late_from = 0.5
# 一局能持有超过 10 个筹码（「查看筹码」面板一页 10 格，多了用两端的箭头翻页）：推荐不按持有的个数封顶
# （剩余三选一次数、前瞻、循环往复的额外三选一都不看已有筹码的个数），面板按页核对（每页格数见 advisor.session.panel 的 PAGE_SLOTS）。

[endless_cycle]
# 循环往复按刷新模型估值：
#   分值 = weight ×（delay 回合后那次随机三选一的期望最高分 × 时间折算 + 增加的 3 次刷新的价值）
#   额外那次三选一：任务来源（三格全随机）、等级按给的时候预计的星数；delay 回合后已到进度上限时记 0；
#     时间折算 = (进度上限 − 当前轮次 − delay) ÷ (进度上限 − 当前轮次)，晚几轮获得的筹码生效的轮次更少。
#   增加的刷新按 [reroll_cost] 的留法分：加上它给的刷新以后，落在留给之后的三选一以内的第 j 次：
#     gain × H(剩余三选一次数 ÷ (现有刷新次数 + j))，与刷新代价同一个模型；
#   超出的是多出来的刷新，只值之后的三选一多连刷一次的提升，算在下一次三选一上：那时之后的三选一少一次、留下的少一次，
#     多出来的比现在多一次。超出的这一次在那时是多出来的第 n + 1 次，值「最多连刷 n + 1 次」比「最多连刷 n 次」多的
#     期望最高分（和刷新的估值同一个连刷递推）：下一次三选一按预计的星数和来源（0～2 星是下一星的升星，3 星以后是任务和
#     筹码商店，按占比），刷新后的分布，拿了循环往复以后的筹码池，分值按现在的已有筹码、不含前瞻（同前瞻）。
#     预计之后不到 1 次三选一时，下一次三选一只有这么大的机会出现，这份提升按它打折（同前瞻影响的次数）。
#     多出来的每一次再以 gain × H(剩余三选一次数 ÷ (现有刷新次数 + j)) 封顶（落在留下的以内时这一次的值）：多出来的只往
#     下调。连刷的提升按实际的刷新后分布算，gain 是所有角色同一个数，刷新收益大的角色（例如凛）连刷一次的提升可能比按
#     gain 算的还高，不封顶时多出来的一次反而比留下的一次值钱。
#   刷新次数没读出来（按默认值补的）时不分多出来的，全部按 gain × H 估。
# delay：拿到后再过几回合给额外那次三选一，按拿到时三选一的来源分（依据攻略视频）：
#   升星、筹码商店拿到的当回合计 1 回合、再等 2 回合；任务拿到的等 3 回合。角色被击倒时跳过回合结束阶段，这一回合不计。
#   拿到循环往复、额外那次还没给时，之后的三选一另算这 1 次（[picks]；Session 记下拿到它的轮次和来源，漏记、补录时点了它的
#   按漏记的那次三选一记，到期以后第一次三格全随机的三选一当作给了，过了到期那一轮的下一轮还没认出来时也不再算）；
#   给了以后额外那次不算进任务和商店三选一的份额。
# star_rate：额外那次三选一的等级按给的时候的星数（攻略视频：稀有度按那时的星级），预计为
#   当前星数 + star_rate × delay（不超过 3 星，不到 1 星时按 1 级）；不是整数时按相邻两级的期望最高分插值。
#   0.25 = 一局 3 次升星分布在约 12 轮里（[picks] end_round 13 减去第 1 轮）。
# weight = 0.3 的依据：
#   ① 刷新代价有意取得偏高（gain 18 高于 0～2 星实测的平均收益约 13，见 [reroll_cost]），用它给增加的刷新估值会偏高：
#      0 星、剩 2 次刷新时，3 次刷新按模型值约 79 分；35 个角色 × 不分地图的筹码（0 星第 1 轮、无筹码，不计前瞻）
#      只有约 13% 的分值达到这么高；
#   ② 模型假定每次刷新最终都会用上，实际刷新次数多于值得刷新的三选一时，多出来的刷新用不上；
#   ③ 推荐基准「阿尔第 1 轮：缓冲盾牌 / 夹心饼干-一般 / 循环往复 → 缓冲盾牌」：按模型全额计算（weight = 1）时
#      翻转为循环往复（0 星 127 对 83，1 星 114 对 68）。增加的刷新价值随现有刷新次数减少而升高
#      （剩余次数越少，每次刷新照看的三选一越多），本局已用掉刷新时最容易翻转。
#      对 12 张地图和地图待识别、升星 / 任务 / 筹码商店三种来源、0~1 星、剩 0~5 次刷新全部保持基准，要求 weight 不超过
#      约 0.38（最紧的是 1 星、剩 0 次、决赛大赛场、升星来源：weight 0.3 时缓冲盾牌 68.0 对循环往复 53.8）；取 0.3 留有余地。
chip = "循环往复"
delay = { levelup = 2, shop = 2, task = 3 }
star_rate = 0.25
weight = 0.3

[income]
# 收入类筹码按剩余兑现次数折算。
#   星光收入：每逢第 3 轮按星光层数发放星币。折算系数 = 到进度上限前剩余的轮次奖励次数 ÷ 第 1 轮时的次数。
#   星币收入：折算系数 = 到进度上限前剩余的轮次 ÷ 第 1 轮时的轮次。
#   读到进度条的当前格时，剩余的按进度条算（进度比轮次走得快时剩下的更少），第 1 轮时的按整局的进度上限算，不跟着变。
#   自己满 3 星后，非经济型角色（没有 economy_trait 特性）的收入再乘 after_max_star：星币不再用于升星。
#   扣分 = 筹码的正分（不含成长分，也不含玩家思路给必选筹码的分）×（星光占比 ×（1 − 星光系数 × m）+ 星币占比 ×（1 − 星币系数 × m））。
#   必选是玩家对这个筹码的整体判断，不随剩余的兑现次数变；推荐、可选两档照旧计入。
# 占比 = 这个筹码的价值里来自收入的比例：纯收入的筹码为 1；兼有攻击、伤害、治愈等效果的按效果估一个比例。
reward_every = 3
after_max_star = 0.5
economy_trait = "经济"
# 带这些特性的角色可以把星光层数直接换成属性（阿尔：每 6 层星光攻击力 +1、防御力 +1），星光占比再乘 exempt_factor。
exempt_traits = ["星光成长"]
exempt_factor = 0.5
# 已持有这些筹码时，星光层数另有用处（值是写进收入折算整句里的用处），星光占比同样乘 exempt_factor
# （借用星光成长那一档，对所有角色生效；角色已带 exempt_traits 特性时不再多乘一次）。
#   金色飞星：放过怪物时目标是首领则额外受到等同星光层数的伤害。减半的幅度没有实测依据，只是借用现有的一档。
exempt_owned = { "金色飞星" = "星光层数还会增加对首领的伤害" }
starlight = { "银行卡-余额少" = 1.0, "银行卡-余额多" = 1.0, "银行卡-用不完" = 1.0, "“8面”骰子" = 1.0, "ATM机" = 1.0, "星币锤" = 0.4, "紫色飞星" = 0.4, "手电筒-强光" = 0.3, "金色飞星" = 0.3 }
coins = { "小猪存钱罐" = 1.0, "汉娜人偶" = 1.0, "缓冲盾牌" = 0.3 }
# late：这些筹码从第几轮起获得时，收入部分在上面的折算之上再乘 late_factor。
#   攻略视频认为蓝色银行卡第 2 轮以后、紫色和金色第 5～6 轮以后收益很低，比按剩余兑现次数平滑折算更严：
#   星光层数一次给足，越晚获得，星币到账越晚，用于升星的价值越低。从视频说的时间点之后一轮起减半。
#   经济型角色（economy_trait）不乘 late_factor，只按剩余兑现次数折算：星币多用于转账给队友，晚到的星币照样转得出去，
#   和满 3 星后不乘 after_max_star 同一个理由。
late = { "银行卡-余额少" = 3, "银行卡-余额多" = 7, "银行卡-用不完" = 7 }
late_factor = 0.5

[map_hints]
# 对局画面上常驻的、某张地图特有的文字。读到就给这张地图加分。
markers = { "异变图书馆" = ["线索"] }

[watch]
# 悬浮窗后台看画面的节奏（毫秒）。数值越大越省资源，反应越慢。
# 平时多久看一次有没有三选一。三选一是限时的，画面出来要尽快给推荐：500 时最多晚半秒看到（1000 时一秒）。
# 平时一帧只读一项（轮次、进度条、星数等），还有到点没读的不等这么久，紧接着看下一帧，每一帧都先看是不是三选一。
idle_ms = 500
# 三选一界面出现期间多久看一次。间隔越短越不容易漏掉「选中」那一下（选中后很快点确定时，
# 两次截图之间看不到绿框，就只能请玩家补录）。150 时每帧间隔约 0.2 秒（300 时约 0.6 秒）。
# 推荐给出以后，三选一期间每一帧只查选中的绿框（几毫秒），三个筹码名一变（刷新、换了一批）才重新识别。
active_ms = 150
# 三选一刚出现时读得可疑（刷新次数读成 0，或概率行三项加起来是 100、却不是 [rarity] 概率表里的一行；刚出现那一帧没读全时
# 看第一次读全的那一次）时，隔这么久再把三张卡完整认一次，每次三选一最多一次。刷新按钮正好被表情气泡挡住、气泡这段时间里
# 消失了，就能改对；认出的和原来不同就按新的重算推荐，相同不动。补认那一下（约 0.3～0.9 秒，看电脑快慢）看不到绿框，
# 到点时正好要读轮次核对的，挪到核对的下一帧；读得正常的不补认。
select_reread_ms = 500
# 三选一开着时读左上角的轮次和进度条（核对先给的推荐、确认变小的轮次等）读不出轮次或出错时，隔这么久再读一次，
# 每次三选一最多再读 3 次：左上角只是被挡了一下的，三选一开着时就能核对、判出新的一局；一直出错也不会每一帧都读。
hud_retry_ms = 1000
# 多久读一次轮次（地图未知时同时读任务栏）。三选一刚出现时，最近 after_game_ms（[map_detect]，30 秒）里读到过轮次，
# 就先用它和进度条给推荐，下一帧再读一次，读到的不同再重算；更久没读到、手动模式、刚切回游戏时照旧先读完再给推荐。
hud_ms = 3000
hero_ms = 20000       # 认出角色之后多久复查一次（角色变了说明开了新的一局）
# 多久读一次自己的星币数。和读星数同一帧读（读星数按 hud_ms），所以实际约 6 秒一次；三选一期间不读。
# 头像认不出自己那一行（倒地等）时，也在这一拍按本局记住的名字找那一行。
coins_ms = 5000
# 过了预筛却不是三选一的画面（战斗等），以及读不到轮次时的选角界面判断：画面没变就沿用上次「不是」的结论，
# 最多隔这么久重新识别一次。越大越省 CPU；万一识别漏了，最多晚这么久。按热键的那一帧一律重新识别。
# 实测战斗画面 5000 / 10000 / 20000 时约占单核 36% / 26% / 25%（地图已识别）、52% / 39% / 34%（地图待识别）。
unchanged_max_ms = 10000
# 低配模式（设置里的开关，默认关）开着时，上面的 idle_ms、hud_ms、hero_ms、coins_ms、unchanged_max_ms、
# select_reread_ms、hud_retry_ms 都乘这个倍数，看得更少；active_ms 不变（三选一显示着时看晚了会漏记选了哪个），
# 看到的东西也不变，只是晚一点出来。
# 实测平时的间隔翻倍时，相关场景的 CPU 大约减半。开着时文字识别另外从 4 个线程减到 2 个（写在识别的代码里，
# 不在这里设）。
lowend_factor = 2
# 全局热键的默认值：按下立即截图识别一次（自动模式和手动模式均可用）。
# 可写 "F8"、"Ctrl+F8"、"Alt+Shift+P" 这样的组合；写 "" 表示不用热键。这个键按下后游戏本身收不到。
# 一般不用改这里：点悬浮窗标题右侧的热键按钮就能更换，换过的热键存在 state.json，优先于这里的默认值。
hotkey = "F8"
# 手动模式（悬浮窗上的开关）平时完全不截图。按热键识别到三选一后：
#   true  继续按 active_ms 的节奏识别，直到三选一关闭，这样才能记录选择了哪个筹码
#   false 每按一次只截一张；选择了哪个筹码要自己填进「已有筹码」
manual_follow = true
# 悬浮窗的默认位置（还没拖动过时）：[x 比例, y 比例, 固定的角]，比例相对游戏窗口的画面。
# 默认把悬浮窗右上角（tr）放在 (98.5%, 52.5%)：右侧「刷新」按钮正下方，内容变多时向下展开。
# 角可写 tl / tr / bl / br（左上 / 右上 / 左下 / 右下），内容增减时这个角不动。拖动后的位置存在 state.json，优先于这里。
# 没有拖动过时，三选一显示期间若这个位置会挡住候选筹码或「刷新」按钮（游戏窗口较小时），
# 改放到挡得最少的地方：游戏窗口外侧（窗口化且屏幕上有空间时）、游戏画面右下角或左下角。三选一关闭后回到这里。
overlay_anchor = [0.985, 0.525, "tr"]
# 推荐日志累计满这么多局时，悬浮窗提示「推荐日志已满 20 局，可以校准」
calibrate_games = 20

[softmax]
# 分数差多少算「明显更好」。25 时相差 55 分约为 90% / 10%。
temperature = 25

[advice]
# 三个候选的总分（内置分 + 适配分 + 推荐流派分 + 前瞻分）都低于此分时，提示「三个都不到推荐线」。
# 取值依据：0 星、无筹码时，游戏内置分原值 ≥ 50（显示「推荐」）的筹码平均占 27%；
# 按同样的比例在总分上划线，35 个角色的分数线中位是 51（1 星时 51）。
recommend_total = 50
# 同系列两张一起出现、总分相差不到 series_near 时，稀有度高的一张排在前面（所有角色适用）。
#   只看不算上位替代、两张都参与推荐度比较的几对（夹心饼干-可口和-美味、两种手持风扇、两种瞄具、几张银行卡等）；
#   严格上位替代的低一级本来就不参与比较、排在最后。
#   只改先后、不改分值：两张的推荐度对调，其余选项的推荐度和先后不变；排在最前的换成高一级时，首推和「刷新」比较的对象
#   跟着它。两张中间夹着别的选项（含刷新）、或其中一张是队友刚需提到第二位的筹码时不对调。
#   3 约为职业分值累加后前瞻里职业偏移的量级（小町 2 星、吉尔 1 星时夹心饼干-可口比-美味高 1.7～2.8）。写 0 时不调整先后。
series_near = 3

[map_detect]
# 离开对局后，画面有变化时做一次整幅画面的文字识别，同一次识别找三样：加载画面上的地图名（地图识别第①层）、
# 畸变组件、对局外的画面。整幅画面的文字识别比较贵：loading、mutators、out_of_game 三项都关掉时不做；
# 只关掉一两项时，开着的几项照样按下面的间隔识别。
# 第①层：地图未知、或本局已结束（两局之间）时，找一段文字恰好是完整地图名的画面（加载画面）。实机的加载画面（数据载入中）
# 上没有地图名，地图名要等加载完才出现；画面变化超过阈值时会再看一次，所以地图名出现得晚也读得到。关掉 loading 只是不找地图名，两局之间的整幅识别放宽到 mutators_ms 的间隔。
loading = true          # 开关
loading_ms = 2000       # 最快多久看一次（毫秒）
loading_width = 1280    # 识别前的缩放：相当于把参考比例的窗口缩到这么宽（其他长宽比按界面缩放折算）。越小越快，太小时文字无法识别
loading_change = 0.03   # 画面和上次看时相比的变化（0~1）超过这个值才重新看；本局还没结束、又认出了房间等对局外画面时，静止的画面也按间隔再认（要连续两次读数才结束本局），本局结束以后静止的画面才只看一次
after_game_ms = 30000   # 最后一次读到轮次之后过多久才算离开了对局（战斗等画面也读不到轮次）；看到选角界面、结算画面等时立即算离开。这段时间以内出现的三选一用手上的轮次先给推荐（见 [watch] hud_ms）
# 畸变组件（梦想号等地图在选角前公布）：在离开对局后的整幅识别里找组件名（data/mutators.json）。
# 还没有公布组件的画面样本，这一项没有实机验证过。
# 不找地图名时（地图已知、对局状态还在，或关掉了 loading），整幅识别的间隔用 mutators_ms。
mutators = true
mutators_ms = 6000
# 对局外的画面（结算画面、「匹配成功」画面、房间、奖励画面）：认出后结束本局（结算画面一次就算；房间、「匹配成功」画面、奖励画面要隔一会儿连续两次读到），房间和「匹配成功」画面上的难度、
# 地图留给下一局。结算画面的底栏和 16:9 附近窗口里的组队房间在判断选角界面的同一次识别里顺带认出，不多花时间；
# 其余靠离开对局后的整幅识别。关掉后不认这几种画面，新的一局照旧按选角界面、轮次变小等判断。
out_of_game = true
# 任务栏一打开就立即读取（按画面上亮蓝色的任务条判断，约 2 毫秒），不等 [watch] hud_ms
task_panel_immediate = true
