# 可调参数。改完直接生效，不用重跑任何脚本。

[rarity]
# 每行是 蓝 / 紫 / 金 的百分比，行号 = 星数（0~3）；任务筹码的等级 1~3 级对应第 1~3 行。
# rows：困难及以上。困难、噩梦、疯狂、极限的筹码概率相同，用同一张表，不区分这几个难度。
rows = [[60, 37, 3], [60, 37, 3], [40, 45, 15], [25, 50, 25]]
# normal：普通难度。两张表没有相同的行，按三选一界面上显示的概率是哪张表里的一行判定本局是不是普通难度。
normal = [[60, 30, 10], [60, 30, 10], [40, 40, 20], [20, 50, 30]]
# 升星和筹码商店最左格的固定稀有度，行号 = 星数（两张表相同）。
fixed = ["蓝", "蓝", "紫", "金"]

[reroll]
# 刷新次数（游戏里的「刷新 ×N」；代码里叫 reroll）：开局 2 次，每升一星 +1，【循环往复】再 +3（按角色合作挑战等级 6 算）。
initial = 2
per_star = 1
endless_cycle = 3

[pool]
# 最左格职业筹码池的成员只用资料库里的池表（参考英文 wiki 的说法：没列出的筹码不会出现在最左格），不按标签补全（见 data/chips.json）。
# 选哪个池按职业权重（职业分值累加）：角色初始职业分值 + 已拿筹码的职业分值。拿了带职业分值的筹码以后，
#   之后升星和筹码商店的最左格更容易出同职业池的筹码（例：主力输出拿了 ATM机，辅助池的权重 +50，攻击池相对变小）。
#   前瞻、刷新估值、开套预判、美工刀预判和治愈来源折算都按累加后的权重算；编辑方案时的「较难出现」是开局前的规划，
#   仍按初始职业分值。
#   依据：两位攻略视频作者都这么说，其中一位给的几组排序（例：邦妮要瞄具时，已有标靶 ＞ 手持风扇 ＞ 标记喷罐）只有按累加
#   才算得出来；游戏里还没有实测。推荐日志攒够后，统计拿了带职业分值的筹码以后最左格出自哪个池再验证；
#   改成 false 时只按初始职业分值。
accumulate_class_points = true
# 以下几项游戏没有公开，先按估计值，实战后校准。
keyword_boost = 2.0          # 已有某流派后，同流派筹码的出现权重倍率
leftmost_class_pool = true   # 升星、筹码商店第一次刷出三选一时，最左格是否只从职业筹码池出
# 刷新后的三选一，最左格的出法（采用 "class_tag"）：
#   "class_tag"   稀有度仍按星数固定，像第一次刷出那样按职业权重（职业分值累加）选职业筹码池，但职业筹码池按筹码的
#                 职业标签建（标签里属于职业的那几个就是它所在的池），不按池表：带职业标签、不在池表里的筹码也可能出现
#   "rarity"      稀有度仍按星数固定，筹码从该稀有度的全部筹码（玩家筹码池）里按普通权重抽，不按职业权重
#   "class_pool"  与第一次刷出相同，按职业权重从职业筹码池（池表）出
#   "random"      与其余两格一样随机，不固定稀有度
# 依据：实机 5 局里来源确定（升星、筹码商店）的 16 次刷新，最左格都是按星数固定的稀有度；其中 3 次是不在任何职业筹码池
#   表里的筹码（磨刀石 2 次、电磁炮 1 次），按池表出（"class_pool"）时它们的概率为 0。逐次算刷出的那张在最左格的概率，
#   这 16 次按 "class_tag" 比按 "rarity" 贴合得多（对数似然高约 7）。样本少，攒到 30～40 次刷新再核对。
reroll_leftmost = "class_tag"
max_schools = 2              # 最多占几个流派，占满后其余流派移出筹码池

[official]
# 游戏内置「选择筹码推荐」的公式。
# 计入总分时整体乘 scale（取 ×0.5：内置分全额计入时，角色分 +100 等会压过玩家思路的档位）。
# 游戏的推荐角标仍按原值判断（同 mechanics/chips.md 第四节）：原值 ≥ strong 的候选都显示「强烈推荐」；没有这样的候选时，
# 原值 ≥ recommend、而且是这一组三个候选里最高的才显示「推荐」（并列最高时都显示）。原值见 engine.Scorer.official_raw。
scale = 0.5
growth = 50       # 成长分：出现轮次 ≤ 成长轮次
# 角色分：适配、普通适配两张名单分别算，同一个角色两张名单都在时两项相加（照 BWIKI 和游戏内核对；
# 现有资料里没有同时在两张名单里的角色）
fit = 100         # 角色分：适配角色
fit_minor = 50    # 角色分：普通适配角色
tag = 40          # 标签分：筹码标签与角色职业相符
# 职业门槛：初始职业分值 + 已有筹码的职业分值 ≥ 此值，才算属于该职业（可以同时属于几个，也可以一个都不属于）。
# 参考英文 wiki 职业权重页的说法：values of 100+ result in that character seeming to "belong" to that role。
# 实机样本里凛（卡牌 80）的小猪存钱罐、书签，汉娜（卡牌 60，拿了维生素药丸后 90）的标记喷罐、小猪存钱罐都没有推荐角标，和这条一致。
# 按门槛 100 和上面的角标规则，实机样本 44 次三选一、132 个筹码的推荐角标都对得上，其中容易算错的两处：照只持有电流核心时的
# 电磁炮（按公式算上关键词分是这一组最高的 60，实机没有角标）：充能流派不算关键词分（见 keyword_schools），只剩基础分 30，
# 不到推荐线；阿尔的银行卡-余额多（220，同组的银行卡-用不完 240，不是最高，实机也有角标）：≥ strong 的候选都显示「强烈推荐」，
# 不只最高的一张。
class_threshold = 100
keyword = 30      # 关键词分：已持有同流派筹码
# 关键词分只算这几个流派：照 BWIKI 和游戏内核对，游戏的算法里充能流派的筹码不管已持有几张充能筹码都没有关键词分。
# 充能筹码之间的配合另由适配表的组合规则和开套预判（[charge_build]）计算，不靠这一项。
keyword_schools = ["治愈", "星光", "标记"]
recommend = 50    # ≥ 此分、且是这一组最高的，显示「推荐」（这一组有 ≥ strong 的候选时不显示「推荐」）
strong = 100      # ≥ 此分的候选都显示「强烈推荐」（不只最高的一张）

[synergy]
# 玩家思路层四档的分值。
core = 110
first = 80
second = 40
avoid = -60
# 必选档的筹码，总分至少比同一次三选一里玩家思路没列入的筹码高出这么多，不够时补足。
# 游戏内置分（角色分 +100、标签分 +40）照样计入没列入的筹码，单看分数时必选可能被压过（例：必选的筹码 120 分，
# 没列入的筹码靠角色分、标签分到 140 分）。
# 30 = 必选和推荐两档的分差；只比这两个时约 77% 对 23%。只在当次三选一里补，前瞻和刷新的估计不受影响。
# 只和未列入的筹码比，不和「刷新」比：必选在场时也可能首推刷新。
core_lead = 30
# 筹码属于角色的推荐流派时的加分。要尽量保住推荐流派的角色（keep_schools）已进入其他流派、要保的流派本局已经进不全时，
# 已进入的那个流派的筹码同样加这么多（之后的打法是这个流派加剩下的一个推荐流派；见 engine.parts._adopted_schools）。
school = 15
# 要尽量保住推荐流派（适配表 [[hero]] 的 keep_schools：true 保全部推荐流派，写流派名的列表只保列出的几个）时的扣分：
# 筹码属于要保的流派以外、还没进入的流派（只保几个时，没列出的推荐流派也算），选择后剩下的流派名额（[pool] max_schools）
# 少于还没进入的要保的流派个数（要保的流派本局再也进不全）时扣这么多；角色写了 keep_schools_penalty 时按角色的扣。
# 不属于流派的筹码不扣。只用于默认推荐（选了自己的方案时由方案的锁定保护代替，见 [scheme] lock）。
# 这类角色的美工刀属于要保的流派时，推荐流派的加分和美工刀的攻击力加成一起按 [heal_knife] ③ 折算：美工刀要先有治愈来源。
# 取 -40：按南希露一局实机记录的 14 次三选一校准，-15 起第 11 轮「电磁炮 / 手电筒-强光 / ATM机」（已有银行卡-余额多）
# 不再首推电磁炮，-40 时 24% 对 68%；第 5 轮出现银行卡-余额多的两次任务三选一都不首推它，第 10 轮金色美工刀（还没有
# 治愈来源）仍首推刷新；不属于流派的精品剑盾、拳击手套照旧。
keep_schools = -40
# 自动层：同一个筹码命中多条规则时，取最高的一条，其余加分按此比例叠加。
extra_rule_factor = 0.3
cap = 120

[scheme]
# 筹码方案（悬浮窗里建的「我的方案」）的分值。选「默认推荐」时不用这一节。
# 以下都是方案模拟里的试验值，积累了按方案推荐的日志后再校准。
# 推荐卡片上的先后按档位排（必选 > 推荐 > 可选 > 未标记 > 不选 > 被锁的其他流派），不看这些分值；同一档的推荐、可选按
# 档位前瞻（下面 same_tier_near），收入降档、拿不到的往后排（income_demote 和 engine.scheme_rank）是这条的例外。
# 分值用在前瞻、刷新的期望、之后会不会选某个筹码的估计，以及未标记的筹码之间的先后。
# 方案里标了档位的筹码：档位的分值代替这个筹码原来的玩家思路和角色特性加分，和 [synergy] 的四档同一把尺子。
# 游戏内置推荐分、组合、配合队友、难度、收入折算、前瞻照算。
# 没标档位的筹码不用默认推荐的任何部分（四档、带条件的规则、推荐流派加分、必选补分），只按角色特性等计算。
# 被锁成不选的流派（列进方案的流派已有两个时其余的流派）里没标档位的筹码，按 skip 计分。
must = 110
recommend = 80
optional = 40
skip = -60
# 目标流派倾向：没标档位、属于目标流派（列进方案的流派里有必选、推荐的）的筹码加分，代替推荐流派加分（[synergy] school）。
target = 25
# 锁定保护：没标档位的筹码属于还没进入的其他流派，选了会占满流派名额（[pool] max_schools）、
# 让某个目标流派本局再也出不来时扣分。
lock = -60
# 档位前瞻（engine.lookahead.tier_lookahead）：同一档的推荐、可选按「选了以后，方案里标了档位的筹码之后出现的机会怎么变」
# 排先后。算法和前瞻相同（影响的次数、拿 / 不拿两边、候选地图平均），只是之后三选一里的筹码按档位给分：必选、推荐、
# 可选、不选取上面的 must、recommend、optional、skip，没标的取 unmarked_lookahead，被锁成不选的流派里没标的按 skip。
# unmarked_lookahead：没标的筹码在档位前瞻里值多少。取得很轻（不到可选的四分之一）：档位前瞻看的是方案里标了档位的
# 筹码出现的机会，没标的强筹码不该把它带偏；又不取 0，好让「之后三选一里都是没标的」略好于「都是不选、被锁的」。
unmarked_lookahead = 10
# same_tier_near：同一档先照顺位排，后一张要两样都更好才和前一张对调（重复到没有可调的）：档位前瞻比前一张高出不少于
# 这么多，并且卡片上写的「选了以后，下一次三选一里至少出现一张必选、推荐的机会」不比前一张低（按卡片上取整后的数比，相等
# 也算；相等时卡片另写的可选那一个也不能更低；方案里没有必选、推荐时比可选的）。档位前瞻相差不到这么多时照方案里的顺位；
# 高出了这么多、卡片上的数却更低（两样方向相反）时也照顺位，卡片写「前瞻差不多，照方案顺位」。只比相邻的两张：顺位 1、2、3
# 的档位前瞻是 0、2.5、5 时，2 越不过 1、3 也越不过 2，照顺位（3 不隔着 2 和 1 比）。
# 取 3：档位前瞻相差 3 左右时，选了两张以后卡片上的数（至少出现一张的机会）中间一半差 1.3～3.2 个百分点（中位数约 2）；
# 相差 1 左右时只差 1 个百分点上下，和出现率模型本身的估计误差相当，照方案里的顺位。按 35 个角色各标三套方案（必选 2、
# 推荐 5、可选 6、不选 2）抽样，之后还有三选一的局面里，同一档两张的档位前瞻约一半相差不到 1、约七成相差不到 3；后一张
# 高出 3 以上（可以对调，还要卡片上的数不更低）的约一成多，这些卡片上的数约四分之三差 2 个百分点以上（中位数约 4）。
same_tier_near = 3
# income_demote：标了推荐、可选的收入类筹码，只按剩下几次兑现折算的那一层扣掉的比例（扣分 ÷ 筹码的正分，不含成长分，和
# [income] 的折算同一个基数；星光、星币按到进度上限前剩余的轮次奖励或轮次折算，engine.parts.IncomeCut.left_cut）不小于这个
# 值时按低一档排（推荐当可选、可选当未标记），排在那一档已有的候选后面；和「刷新」比时也按低一档的级数。满 3 星后的减半
# （[income] after_max_star）、较晚拿到的银行卡再减半（late_factor）照样算进分里，但不算进这个比例。轮次未知时没有剩余兑现
# 那一层，不降档。
# 0.5 = 只按剩下几次兑现算，收入部分的价值打折一半以上（剩下一半或更少，正好一半也降）。只有收入占比（[income] 的
# starlight、coins）不低于 0.5 的筹码才可能降档；必选那一档的分不扣收入折算，必选也不降档。
income_demote = 0.5

[survival]
# 难度（分项名「难度」）：困难及以上难度（含尚未判定难度时）生存类筹码加分，普通难度不加，不随轮次变化。
#   生存类筹码和各自的分值取 trait 这条特性的加分规则（摩托头盔-高级 35，医疗箱-完备治疗、安全气囊 30，……），乘 factor。
#   已带这条特性的角色不再加（自动层已按全额计入）。加分叠加在玩家思路之上，与组合、队友的分项相同。
# factor = 0.5：加分为 7.5~17.5，在适配表「弱依赖 +10~20」的范围内。依据：难度越高怪物数值越高、地图事件更早，
#   进度上限更短，角色被击倒使进度 +1 的代价更大；这条特性的分值已经按「生存能力低的角色」校准过，取一半。
trait = "需要生存"
factor = 0.5
# fighter_*：经常挑战怪物的角色（带 fighter_traits 中的特性）在困难及以上，防御力加成筹码（fighter_chips）的「难度」加分
#   再加 trait 分值 × fighter_factor，合在同一个分项里。防御力减少的是挑战怪物时受到的反击伤害，
#   这类角色挑战得最多。取 0.5：与 factor 相加后按 trait 分值全额计（摩托头盔-高级 +35、-中级 +25、-一般 +15）；
#   单独这一条：35 个角色里金头盔排进前 25 的由 18 个增至 33 个，横向首推变化 0.4%。已带 trait 特性的角色仍然不加。
fighter_traits = ["物理输出"]
fighter_chips = ["摩托头盔-一般", "摩托头盔-中级", "摩托头盔-高级"]
fighter_factor = 0.5
# nightmare_*：确定是噩梦及以上难度（噩梦、疯狂、极限）时，nightmare_chips 的「难度」加分改为 trait 分值 × nightmare_factor，
#   对所有角色相同，经常挑战怪物的角色不再另加 fighter_factor。依据：噩梦及以上怪物数值更高，
#   角色被击倒使进度 +1 的代价更大，高级防御力加成对所有角色收益都较高。摩托头盔-高级 35 × 1.5 = 52.5。
#   已带 trait 特性的角色（自动层已按全额计入 35）另加 trait 分值 × nightmare_trait_factor（17.5），合计同样是 1.5 倍。
#   只改摩托头盔-高级：摩托头盔-中级、-一般和其他生存类筹码不变。困难、困难及以上（分不出困难还是噩梦）、
#   难度读不到时维持上面的算法；普通难度不加。
nightmare_chips = ["摩托头盔-高级"]
nightmare_factor = 1.5
nightmare_trait_factor = 0.5
# skip_maps：在这些地图上，列出的筹码不加「难度」分（含上面噩梦及以上的加分）。地图待识别时照常加。
#   水乡古镇：怪物压力低（高升炮可远距离击中怪物并使其本轮无法反击），摩托头盔的防御力加成收益低
#   （攻略视频：摩托头盔看地图压力，低压地图和水乡古镇不推荐）。
skip_maps = { "水乡古镇" = ["摩托头盔-一般", "摩托头盔-中级", "摩托头盔-高级"] }

[extreme]
# 难度（分项名「难度」）：本局难度是 difficulty（极限）时，chips 里的筹码对所有角色加分，
#   与玩家思路、[survival] 的加分叠加。整句写在 reasons，理由标签的短句是「难度：极限」。
#   本局是极限：画面上读到极限，或者进度条红叉的格数只和极限的进度上限对得上（御魂庆典 17 格），按进度上限推算成极限。
#   星趴·梦想号、水乡古镇的极限和疯狂进度上限相同，只靠推算分不出，要画面上读到「极限」才加；不知道具体难度名时不加。
# 依据：攻略视频把疯狂和极限分开判断：极限难度复仇之戟几乎稳定生效、谁看到都可以拿，诅咒之剑可以直接拿，
#   三叉戟全队攻击力、防御力 +1 的收益大。
difficulty = "极限"
chips = { "复仇之戟" = 20, "诅咒之剑" = 15, "三叉戟" = 15 }
