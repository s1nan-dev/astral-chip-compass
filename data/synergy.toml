per = 10
max = 20
reason = "队友「{mates}」在怪物带有标记时技能收益更高；手持风扇无需战斗即可施加标记（使用主动技能后对 6 格内的怪物施加 1 层），被标记的怪物受到的所有伤害 +1，标记在怪物每个回合结束时减 1 层"
