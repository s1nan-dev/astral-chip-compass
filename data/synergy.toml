# ============================================================ 队友调分
# 按队友（State.teammates，由玩家列表识别）调分；不知道队友时不调分。
#   chips        对哪些候选筹码调分
#   who          计哪些队友：human 真人 / bot 电脑 / any 全部（默认）
#   traits       可选：只计角色带这些特性之一的队友；heroes 可选：只计这些角色的队友
#   self_heroes  可选：只在自己是这些角色时生效；self_traits 可选：只在自己的角色带这些特性之一时生效
#   per          每个符合条件的队友加减多少分；min_count 至少几个才生效（默认 1）；max 调整量的绝对值上限
#   reason       理由：「{n}」替换为符合条件的队友人数；「{mates}」替换为这些队友的角色名
#                （写在「」里时每个角色名各加一对「」）
#   short        理由标签上的短句：「{mates}」替换为「邦妮、凛」「邦妮等 3 名」这样的写法，「{n}」替换为人数
#
# 写法：凡是因为队友加的分，理由里都写明是因为哪几名队友。加分规则的 reason 直接从队友写起：
# 「队友「{mates}」……」，后面写清实际机制，不另加前缀；short 写「配合队友：{mates}」，
# 只计电脑队友的写「配合队友：{mates}（电脑）」。扣分规则写缺点（short「电脑队友不配合站位」「与队友的半血打法冲突」）。
#
# 分值取得小（每名队友 5~10 分；单条规则合计不超过 20，银行卡-用不完的两条可叠加到 25；白泽赐福一组按治愈层数计，
# 完备治疗对真人姬梦朝为 +12.5；照的三名队友都较少挑战怪物时额外电池合计 -45，降神几乎没有合适的目标），
# 只对效果直接作用于队友、或依赖队友技能的筹码调分：
#   - 作用于队友的筹码：按队友能否从该效果获得额外收益加分（攻击力加成给物理输出的队友，治愈层数给经常受伤的队友，
#     轮次奖励星币给真人队友）。
#   - 范围增益（大碗炖肉 5 格、大铜锣 4 格）：电脑队友不会配合站位，每名扣 5 分。大碗炖肉另对半血打法的队友扣分。
#   - 转账类筹码（ATM机、友情徽章、节日红包、汉娜人偶）不按电脑调分：触发条件是持有者自己转账，
#     持有者获得的收益与对方是谁无关。
#   - 角色联动（角色资料里的联动效果）：标记（凛、邦妮、赛克斯）、姬梦朝与姬梦枫、糖糖与超天酱、
#     照与输出角色（三名队友都较少挑战怪物时反过来扣分）、恋与生存能力低的角色、恋的鼠鼠护盾与优雅之羽、
#     姬梦朝的白泽赐福与治愈来源、芬妮触发的事件与凛的活体书页、真梦梓给牌与以手牌为资源的角色、
#     远野汉娜的移动与队友橘雪莉（挚友祝福，见文件末尾「只对个别角色的队友调分」）。

# ---------------------------------------------------------- 标记
# 标记施加在怪物身上，被标记的怪物受到的所有伤害 +1，对全队生效；凛、邦妮、赛克斯另从标记获得额外收益：
# 邦妮攻击带标记的怪物时攻击力 +3，赛克斯的魔渊触须单次 1 点、次数多，凛的活体书页在目标标记 ≥3 时出牌数 +1。
# 按施加标记的方式区分：标靶、手持风扇无需战斗即可施加，所有角色都加；标记喷罐在效果牌造成伤害后施加，
# 只对常用效果牌造成伤害的角色加；瞄具在攻击时施加，只对物理输出角色加。
# 这四条的筹码分组与「队友刚需」里邦妮、凛能提供的筹码（[[need]] 的 give）一致，由测试核对。
[[teammates]]
chips = ["标靶"]
traits = ["标记受益"]
per = 10
max = 20
reason = "队友「{mates}」在怪物带有标记时技能收益更高；标靶无需战斗即可施加标记（回合开始时对 4 格内最近的怪物施加 1 层），被标记的怪物受到的所有伤害 +1，标记在怪物每个回合结束时减 1 层"
short = "配合队友：{mates}"

