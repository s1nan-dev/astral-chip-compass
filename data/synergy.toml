# 远野汉娜的移动加成：经过队友橘雪莉时挚友祝福使她下次移动速度 +2、获得 1 层推理时间，移动加成使远野汉娜更常经过她。
[[teammates]]
chips = ["速度轮滑-初级", "速度轮滑-中级", "速度轮滑-高级", "永动机", "梦想号模型"]
heroes = ["橘雪莉"]
self_heroes = ["远野汉娜"]
per = 10
reason = "队友「{mates}」被远野汉娜经过时，挚友祝福使这名队友下次移动速度 +2 并获得 1 层推理时间；移动加成使远野汉娜更常经过她"
short = "配合队友：{mates}"

# 摩西的小鲤鱼玩偶：恋的潜能给鼠鼠护盾时另给 1 层反击，反击时攻击力、防御力永久 +1。
[[teammates]]
chips = ["小鲤鱼玩偶"]
heroes = ["恋"]
self_heroes = ["摩西"]
per = 10
reason = "队友「{mates}」的主动技能另给 1 层反击，小鲤鱼玩偶在反击时使攻击力、防御力永久 +1"
short = "配合队友：{mates}"

# 潘大猛的友情徽章、大碗炖肉：吃下食物时为 5 格内的友方恢复生命（友情徽章按治疗友方触发，不是转账）、大碗炖肉每回合为
# 5 格内的角色恢复生命，电脑队友不会配合站位，每名 -5（大碗炖肉另有「作用于队友的筹码」那一条每名 -5）。
[[teammates]]
chips = ["友情徽章", "大碗炖肉"]
who = "bot"
self_heroes = ["潘大猛"]
per = -5
max = 15
reason = "{n} 名队友为电脑，不会配合站位：吃下食物和大碗炖肉为 5 格内的友方恢复生命时，作用到的队友较少"
short = "电脑队友不配合站位"


# ============================================================ 队友刚需（排第二）
# 真人队友是下面这些角色时，自己能提供其刚需的筹码排到第二位（第一位不动，engine.advice._need_second），条件：
#   - 这个筹码排在第三名及以后（「刷新」也参加排名）；
#   - 筹码本身（不计为正的「队友」分项）达到推荐线（rules.toml [advice] recommend_total）；
#   - 不会把自己锁进对自己没用的流派：筹码的流派既未持有、也不是自己的推荐流派，拿了以后流派名额占满、
#     有推荐流派本局再也进不去时不提（按自己的方案计算时，推荐流派换成列进方案的流派）。
# 电脑队友和角色待识别的队友不算。理由写明是为了哪名队友。
#   hero   队友的角色；what  刚需的是什么；why  为什么是刚需（写机制）
#   give   自己能提供的筹码，一组一个 chips；可写 self_traits：自己的角色带这些特性之一时这一组才算
# 邦妮、凛的 give 分组和上面「标记」那四条队友调分一致，由测试核对。
# 名单只收「选了这个筹码就直接帮到这名队友」的情形：邦妮、凛（标记），阿尔（星光）。姬梦朝不在名单里：
# 治愈来源加在自己身上，选了它是借姬梦朝的白泽赐福给自己加攻击力，并不直接帮到姬梦朝；这部分只保留上面
# 「姬梦朝的白泽赐福与治愈来源」那四条队友调分（只对物理输出角色）。
[[need]]
hero = "邦妮"
what = "标记"
why = "邦妮攻击带标记的怪物时攻击力 +3，击倒带标记的怪物获得 1 张战斗牌"
give = [
  { chips = ["标靶"] },
  { chips = ["手持风扇-小", "手持风扇-大"] },
  { chips = ["标记喷罐"], self_traits = ["效果牌伤害", "多出效果牌"] },
  { chips = ["普通瞄具", "鹰眼瞄具"], self_traits = ["物理输出"] },
]

[[need]]
hero = "凛"
what = "标记"
why = "凛的活体书页命中标记 3 层及以上的怪物时，本回合出牌数 +1"
give = [
  { chips = ["标靶"] },
  { chips = ["手持风扇-小", "手持风扇-大"] },
  { chips = ["标记喷罐"], self_traits = ["效果牌伤害", "多出效果牌"] },
  { chips = ["普通瞄具", "鹰眼瞄具"], self_traits = ["物理输出"] },
]

[[need]]
hero = "阿尔"
what = "星光"
why = "阿尔每拥有 6 层星光攻击力、防御力各 +1；ATM机在转账时使自己和对方各获得 1 层星光"
give = [
  { chips = ["ATM机"] },
]
