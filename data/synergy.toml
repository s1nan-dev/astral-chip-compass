# core / first / second / avoid 四档；[[player.rule]] 写带条件的规则（写在前面的先匹配，理由以「筹码方案：」开头）。


# ============================================================ 组合规则
# 已持有 owned 中任意一个筹码时，候选筹码在 chips 中的加减 score 分。
# 理由里的「{owned}」替换为触发规则的已有筹码（写在「」里时，每个筹码名各加一对「」）。
# 可选条件：heroes = [...] 只对这些角色；traits = [...] 只对带这些特性之一的角色；
#           exclude = [...] 不对这些角色；exclude_traits = [...] 不对带这些特性之一的角色。
# - 玩家思路里带 needs_owned、needs_source 条件的规则已经处理了组合关系，命中时不再叠加组合规则。
# - 同一个候选筹码命中几条组合规则时分值相加（例如同时持有医疗箱和维生素药丸，美工刀两条都加）。
# - 组合分不计入前瞻。
#
# 分值的尺度：强依赖（没有来源时基本不生效，例如魔法箭袋要有标记来源、电磁炮要有充能来源）约 +30，
#   弱依赖（有来源时更稳定或更强）+10~20，冲突 -10~-30。
#   组合规则对所有角色生效（可用 traits、exclude_traits 等限定）、不看角色是否看重这类效果，所以取得比角色专属规则里
#   带条件的规则保守；对某个角色更值的，另在它的角色专属规则里加。
#   「半血」特性的角色（帕帕拉：潜能使主动技能期间视为生命值不超过一半，与实际生命值无关）不参与美工刀和半血筹码的冲突，
#   她的冲突已由「半血」特性的规则处理；美工刀与治愈来源那四条加分照常对她生效（视为半血的那一轮仍可满血）。

