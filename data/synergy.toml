# 适配表。三块内容，都可以直接手改，改完直接生效：
#
#   [[trait]]   特性规则：一条特性 → 哪些筹码加减多少分、为什么。
#   [[hero]]    角色自动层：每个角色有哪些特性、推荐流派、只属于该角色的个别规则。
#               依据是角色的职能、技能和潜能文本。
#               keep_schools = true：推荐流派都要尽量保住。筹码属于推荐流派以外、还没进入的流派，选择后剩下的流派名额
#               少于还没进入的推荐流派个数（推荐流派本局再也进不全）时扣分，分值见 rules.toml [synergy] keep_schools；
#               已进入推荐流派以外的流派、推荐流派本局已经进不全时，已进入的那个流派同样按推荐流派加分（[synergy] school）。
#               keep_schools = ["标记"]：只保列出的流派（要在 schools 里）。没列出的推荐流派也算其他流派：它的筹码照旧
#               按推荐流派加分，选择后会让列出的流派本局进不全时同样扣分。只保一个流派时（列表只写一个，或写 true 而
#               推荐流派只有一个）没有「已进入的流派同样加分」。
#               keep_schools_penalty = -60：这个角色的扣分（负数），不写时用 rules.toml [synergy] keep_schools。
#   [[player]]  玩家思路层（默认推荐的档位）：必选 core / 推荐 first / 可选 second / 不选 avoid，
#               以及带条件的规则。同一个筹码两层都有时，以玩家思路层为准。现在没有角色写这一层（见那一节的说明）。
#
# 规则（rule）可用的条件：
#   maps = ["水乡古镇"]            只在这些地图生效
#   needs_owned = ["复仇之戟"]     已持有其中任意一个时才生效
#   needs_source = "充能"          有这种体系的来源时才生效：已持有 rules.toml [sources] 里那一项列的筹码，
#                                 或自己的角色、任一队友是那一项列的角色
#   without_source = "充能"        没有这种体系的来源时才生效。和 needs_source 成对写在同一筹码的两条规则上，
#                                 任何局面恰好命中一条
#   max_round = 6                 轮次不超过该值时才生效（轮次未知时视为满足）
#   exclude = ["帕露南"]           不对这些角色生效（只用于特性规则：带这条特性、却不适用这条规则的角色）
#   difficulty = "普通"            只在本局难度识别为普通时生效（困难及以上、难度未知时不生效；现在只能写「普通」）
# 玩家思路层里，rule 写在前面的先匹配；没有匹配到 rule 才看四个列表。
#
# 特性的 desc 是书面化的特性说明：推荐理由「另符合：……」引用 desc，不显示特性名。
#
# 净效果（net，只写在扣分规则上）：这条扣分说的是同一筹码另一条加分规则里的同一个效果时（例如「辅助定位」的星币锤 -20
# 说的就是「经济」+40 里「攻击时花费星币增加攻击力」那一半），写 net = { "加分规则的来源" = "净效果的短句" }，
# 来源是特性名，角色专属规则写「角色」。那条加分规则是该筹码自动层分值最高的一条时，推荐卡片上两条合成一个理由标签：
# 短句写净效果，颜色按两条分值之和，悬停显示两条整句。分值不变，筹码名按钮的悬停明细里仍是两条。
# 净效果的短句：净值为正时写「加分的要点（限制）」，例如「获得星光（攻击加成难触发）」；净值为负时写缺点，
# 例如「需满血，与半血打法冲突」。
#
#   [[combo]]      组合规则：已持有 owned 中任意一个筹码时，候选筹码在 chips 中的加减 score 分。
#   [[teammates]]  队友调分：按符合条件的队友人数，对依赖队友的筹码加减分。
# 两节的写法见文件末尾的说明。


# ============================================================ 特性规则
#
# 治愈层数的来源有：医疗箱-完备治疗（每回合 3 层）、医疗箱-紧急治疗 / 大碗炖肉（每回合 1 层）、
# 维生素药丸（每获得 1 张牌 1 层）、可口糖果（每打出 1 张手牌 1 层）、缓冲盾牌、友情徽章。
# 看重「治愈层数 / 每回合回血」的规则要把前五个一起列上，不能只列医疗箱：
# 维生素药丸的游戏内置基础分只有 1，可口糖果是 10（同是紫色，比一般紫色筹码的 20 低），规则里漏掉它们，
# 它们就会沉到下面。列了医疗箱-紧急治疗的规则也要列维生素药丸和可口糖果。

[[trait]]
name = "通用"
desc = "对所有角色均成立的通用规则"

# 循环往复不在这里给固定分：引擎按刷新模型估值（rules.toml [endless_cycle]），自动层的规则对它不生效。

