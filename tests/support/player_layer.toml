# 测试用的默认推荐档位（玩家思路层，写法和 data/synergy.toml 的 [[player]] 相同）。
# data/synergy.toml 现在没有角色写这一层；测档位、必选补分、带条件的规则、复制默认推荐、方案编辑窗口里默认档位的
# 测试由 tests/support/player_layer.py 把这一份按适配表的读法载入，换进资料库的副本里用。
# source 标明来源：source = "攻略" 是按攻略视频和实际打法整理的玩家思路（两者冲突时以视频为准）。
# note 是这个角色玩家思路的原文：有必选档（core）的角色，推荐卡片上「筹码方案：必选」的悬停说明写的就是 note。

[[player]]
hero = "凛"
source = "攻略"
note = "推荐流派为标记。必选：忍术飞镖、魔法箭袋、大背包；推荐：标记喷罐；可选：手持风扇-小、手持风扇-大（属于标记流派，选择后同流派筹码出现率提高，含魔法箭袋）。治愈流派有可口糖果，可提高生存能力。星光流派对凛无收益（星光流派 9 个筹码，含三张银行卡），不选银行卡。小猪存钱罐获得的是星币，不属于星光流派；凛的星币并不紧缺，前期另有更需要的蓝色筹码，收益较低"
schools = ["标记", "治愈"]
core = ["忍术飞镖", "魔法箭袋", "大背包"]
first = ["标记喷罐"]
second = ["手持风扇-小", "手持风扇-大"]
# 凛不选银行卡：星光流派对凛无收益。三张银行卡放进不选档，其余 6 个星光流派筹码扣 40。
# 「星光」是叠层状态，「星币」是货币：小猪存钱罐只获得星币、没有流派，不算星光流派；按攻略视频另扣 20
# （凛不缺星币，前期有更需要的蓝色筹码）。
avoid = ["银行卡-余额少", "银行卡-余额多", "银行卡-用不完"]

[[player.rule]]
chips = ["“8面”骰子", "ATM机", "手电筒-强光", "星币锤", "紫色飞星", "金色飞星"]
score = -40
reason = "筹码方案：星光流派对凛无收益"
short = "筹码方案：星光流派无收益"

[[player.rule]]
chips = ["小猪存钱罐"]
score = -20
reason = "筹码方案：凛不缺星币，前期有更需要的蓝色筹码"
short = "筹码方案：凛不缺星币"


[[player]]
hero = "芬妮"
source = "攻略"
note = "推荐流派为星光。必选：银行卡-用不完（金色银行卡）、紫色飞星、金色飞星。较少与首领正面交战，两张飞星在放过怪物时触发，效果叠加"
schools = ["星光"]
core = ["银行卡-用不完", "紫色飞星", "金色飞星"]
first = []
second = []
avoid = []


